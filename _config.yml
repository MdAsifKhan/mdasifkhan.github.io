profile:
  name: "Asif Khan"
  tagline: "Staff Scientist, Harvard Medical School"
  organization_url: "https://hms.harvard.edu/"
  photo: "assets/img/prof_pic.jpeg"
  location: "Boston, MA"

research_directions:
  - title: "Longitudinal health representations"
    detail: "Scalable representation and generative models that learn patient health states from large-scale longitudinal clinical data."
  - title: "Pan-cancer risk stratification"
    detail: "Robust and well-calibrated models that identify high-risk patients across cancers, populations, and clinical settings."
  - title: "Perturbation models"
    detail: "Models of cellular response learned from drug and CRISPR perturbation data to guide combination therapy design."
  - title: "Geometry and interpretability"
    detail: "Geometric methods for understanding learned representations and interpreting large language models."

selected_work:
  - title: "Pancreatic cancer risk prediction using deep sequential modeling of longitudinal diagnostic and medication records"
    venue: "Cell Reports Medicine"
    year: 2025
    detail: "A transformer-based risk model trained on population-scale longitudinal electronic health records."
    url: "https://doi.org/10.1016/j.xcrm.2025.102359"
  - title: "Capacity and Redundancy Trade-offs in Multi-Task Learning"
    venue: "UAI"
    year: 2026
    detail: "An analysis of how shared representations balance capacity and redundancy across learning tasks."
    url: "https://arxiv.org/abs/2607.16554"
  - title: "The Geometrical and Topological Signature of Transformers"
    venue: "ICLR Workshop GRaM"
    year: 2026
    detail: "A geometric and topological framework for studying how transformer representations evolve across layers."
    url: "https://openreview.net/forum?id=2Rg0GZfWFo"

